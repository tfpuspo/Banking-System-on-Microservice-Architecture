grpc:
  server:
    port: ${GRPC_PORT:50051}
    reflection-service-enabled: true   # lets grpcurl introspect without needing the .proto file

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:auth_db}
    username: ${DB_USER:auth_user}
    password: ${DB_PASSWORD:auth_pass}
  jpa:
    hibernate:
      ddl-auto: update   # auto-creates/updates tables on startup, no manual SQL needed
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-before-any-real-use-01234567}
    ttl-seconds: ${JWT_TTL_SECONDS:900}

# Note: this service has no spring-boot-starter-web dependency, so Spring Boot
# does NOT start an embedded Tomcat here — this process is a pure gRPC server,
# nothing listens on an HTTP port.
